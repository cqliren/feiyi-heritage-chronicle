<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例资料库 | 非遗观察 Heritage Chronicle</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft Yahei",sans-serif;}
        body{background:#f8f9fa;color:#333;font-size:14px;}
        .container{max-width:1200px;margin:0 auto;padding:16px;}
        header{background:#2c3e50;color:#fff;padding:20px 16px;text-align:center;border-radius:0 0 12px 12px;}
        header h1{font-size:22px;margin-bottom:6px;}
        .switch-bar{display:flex;justify-content:center;gap:12px;margin:20px 0;}
        .switch-btn{padding:8px 20px;border-radius:20px;border:none;cursor:pointer;font-size:14px;}
        .btn-active{background:#2c3e50;color:#fff;}
        .btn-normal{background:#eee;color:#333;}
        .search-box{width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:30px;margin-bottom:20px;outline:none;}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #00000010;}
        th,td{padding:12px 10px;border:1px solid #eee;text-align:left;}
        th{background:#2c3e50;color:#fff;font-weight:normal;}
        td a{color:#3498db;text-decoration:none;}
    </style>
</head>
<body>
    <header>
        <h1>案例资料库｜非遗观察</h1>
    </header>
    <div class="container">
        <div class="switch-bar">
            <button class="switch-btn btn-normal" onclick="switchView('public')">非遗视界</button>
            <button class="switch-btn btn-active" onclick="switchView('case')">案例资料库</button>
        </div>
        <input class="search-box" id="searchInput" placeholder="检索案例标题、分类、传播亮点..." onkeyup="searchCase()">
        <table>
            <thead>
                <tr>
                    <th>标题</th>
                    <th>分类</th>
                    <th>发布时间</th>
                    <th>传播价值摘要</th>
                    <th>原文链接</th>
                </tr>
            </thead>
            <tbody id="caseTable"></tbody>
        </table>
    </div>
    <script src="switch.js"></script>
</body>
</html>
